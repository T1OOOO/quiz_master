<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учебная библиотека · Quiz Master</title>
<style>
:root{color-scheme:light dark;--ink:#414337;--muted:#646554;--paper:#efe9dc;--panel:#f6f0e4;--line:#a9a58d;--accent:#3e6339;--clay:#934a30;--table-head:#e4e5d4;--table-cell:#fffaf0}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:17px/1.7 system-ui,sans-serif;background-image:radial-gradient(ellipse at top right,#e0e5cf99,transparent 60%)}button,a{touch-action:manipulation}a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 18px}button:hover{border-color:var(--accent);background:#e8e9d9}button:focus-visible,a:focus-visible{outline:3px solid var(--clay);outline-offset:3px}button:disabled{cursor:default;opacity:.7}
header{border-bottom:1px solid var(--line);padding:14px 4vw;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--paper) 88%,transparent);position:sticky;top:0;z-index:2;backdrop-filter:blur(10px)}.brand{font-weight:700;letter-spacing:-.03em;text-decoration:none;font-size:23px}header .subtitle{font-size:14px;color:var(--muted)}header .home{margin-left:auto}main{max-width:1160px;margin:38px auto;padding:0 24px 60px}h1,h2,h3{color:var(--ink);font-family:Georgia,serif;line-height:1.2;font-weight:600;letter-spacing:-.02em}h1{font-size:clamp(32px,4vw,52px)}h2{font-size:29px;margin-top:46px}h3{font-size:23px}p{margin:18px 0}.intro{max-width:720px}.eyebrow{color:var(--clay);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:36px}.card{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--panel)}.card img{display:block;width:100%;height:210px;object-fit:cover}.card-body{padding:20px 24px}.card h2{font-size:27px;margin:4px 0 12px}.meta{font-size:13px;color:var(--muted)}.card button{margin-top:10px}.article-shell{display:grid;grid-template-columns:220px minmax(0,760px);gap:46px}.toc{position:sticky;top:100px;align-self:start;font-size:14px;max-height:calc(100vh - 120px);overflow:auto;border-left:2px solid var(--line);padding-left:18px}.toc-title{color:var(--ink);font-weight:700;margin:0 0 10px}.toc a{display:block;margin-bottom:8px;text-decoration:none;padding:6px 8px;border-radius:8px}.toc a:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}article{min-width:0}article h1{font-size:clamp(30px,4vw,43px)}article h2{scroll-margin-top:110px}figure{margin:24px 0}figure img{width:100%;display:block;border-radius:18px}figcaption{font-size:12px;color:var(--muted);margin-top:7px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin:22px 0;background:var(--table-cell)}table{border-collapse:collapse;width:100%;font-size:15px;color:var(--ink)}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);background:var(--table-cell)}th{background:var(--table-head);font-weight:700}tr:last-child td{border-bottom:0}blockquote{margin:24px 0;padding:15px 22px;background:var(--table-head);border-left:4px solid var(--accent);border-radius:0 12px 12px 0}code{font-size:.85em;background:var(--table-head);padding:2px 5px;border-radius:4px}.objectives{padding:20px 26px;border:1px solid var(--line);border-radius:14px;background:var(--table-head)}.source-list{word-break:break-word}.practice-start{margin-top:35px;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--table-head)}.quiz{max-width:800px;margin:auto}.quiz-progress{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}.options{display:grid;gap:12px;margin:26px 0}.options button{text-align:left;padding:18px}.options button.correct{border-color:#738c5d;background:#e2e9d6}.options button.incorrect{border-color:#b17760;background:#f0dfd5}.quiz h1{font-size:30px;line-height:1.35}.overlay{position:fixed;inset:0;background:#30332988;display:grid;place-items:center;padding:20px;z-index:5}.dialog{max-width:580px;max-height:85vh;overflow:auto;background:var(--panel);padding:28px;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 80px #282b2144}.dialog h2{margin:0;font-size:28px}.dialog .actions{display:flex;flex-wrap:wrap;gap:10px}.score{font-family:Georgia,serif;font-size:66px;color:var(--accent)}.sr-only{position:absolute;left:-10000px}.site-footer{color:var(--muted);font-size:13px;margin-top:48px;border-top:1px solid var(--line);padding-top:20px}[hidden]{display:none!important}
@media(prefers-color-scheme:dark){:root{--ink:#f7efe5;--muted:#d4c6b5;--paper:#1e1a17;--panel:#2b251f;--line:#817466;--accent:#b4d891;--clay:#ffb494;--table-head:#3b342c;--table-cell:#27221d}body{background-image:radial-gradient(ellipse at top right,#3e4a3599,transparent 60%)}button:hover{background:#40382f}.options button.correct{border-color:#9ecb77;background:#33462b}.options button.incorrect{border-color:#e59b7c;background:#4a3029}}
@media(max-width:760px){main{padding:0 18px 40px;margin-top:24px}.cards{grid-template-columns:1fr}.article-shell{grid-template-columns:1fr;gap:15px}.toc{position:static;max-height:none;padding:12px 0;border:0}.toc a{margin-bottom:4px;border:1px solid var(--line)}header .subtitle{display:none}.card img{height:190px}article h2{font-size:26px}.table-wrap{position:relative;padding-bottom:24px}.table-wrap::after{content:'↔ Листайте таблицу';position:absolute;right:10px;bottom:3px;color:var(--muted);font-size:12px}table{min-width:560px}.dialog{padding:22px}.quiz h1{font-size:25px}}
</style>
</head>
<body>
<header><a class="brand" href="#">Quiz Master</a><span class="subtitle">Читать · понимать · вспоминать</span><button class="home" id="home">Все материалы</button></header>
<main id="main"></main>
<div class="overlay" id="feedback" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="feedback-title"><h2 id="feedback-title"></h2><p id="feedback-explanation"></p><p class="meta" id="countdown"></p><div class="actions"><button id="pause">Остановить переход</button><button id="next">Продолжить</button></div></section></div>
<script>
'use strict';
const modules = /*__STUDY_PAYLOAD__*/[];
const main=document.getElementById('main'),feedback=document.getElementById('feedback');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=null,questions=[],questionIndex=0,answers=[],timer=null,paused=false,previousFocus=null;
function stopTimer(){if(timer){clearTimeout(timer);timer=null;}}
function closeFeedback(){stopTimer();feedback.hidden=true;}
function footer(){return '<p class="site-footer">Самопроверка помогает вспомнить материал. Иллюстрации создают контекст; точные карты, исторические документы и источники смотрите по ссылкам в статье.</p>';}
function home(){closeFeedback();current=null;main.innerHTML='<div class="intro"><p class="eyebrow">Учебная библиотека</p><h1>За хорошим ответом —<br>интересная история.</h1><p>Разберитесь в большой теме через примеры и связи. После чтения проверьте себя: двадцать вопросов, объяснения и ссылки, к которым можно вернуться.</p></div><div class="cards">'+modules.map(m=>'<section class="card"><img src="../assets/'+escapeHTML(m.metadata.id)+'-hero.png" alt="Иллюстрация к теме '+escapeHTML(m.metadata.title)+'" loading="lazy"><div class="card-body"><p class="meta">'+escapeHTML(m.metadata.category)+' · ≈ '+m.metadata.reading_minutes_estimate+' мин чтения · 20 вопросов</p><h2>'+escapeHTML(m.metadata.title)+'</h2><p>'+escapeHTML(m.metadata.description)+'</p><button data-open="'+escapeHTML(m.metadata.id)+'">Открыть материал →</button></div></section>').join('')+'</div>'+footer();main.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>location.hash=b.dataset.open);}
function article(id){closeFeedback();current=modules.find(m=>m.metadata.id===id);if(!current){home();return;}const m=current.metadata;main.innerHTML='<div class="article-shell"><nav class="toc" aria-label="Содержание статьи"><p class="toc-title">Содержание</p></nav><article><p class="eyebrow">'+escapeHTML(m.category)+'</p><p class="meta">≈ '+m.reading_minutes_estimate+' мин чтения</p>'+current.html+'<section class="objectives"><strong>После изучения вы сможете</strong><ul>'+m.objectives.map(x=>'<li>'+escapeHTML(x)+'</li>').join('')+'</ul></section><section class="practice-start"><h3>Проверьте, что запомнилось</h3><p>20 вопросов по теме. Варианты перемешиваются, после выбора появляется объяснение.</p><button id="start-quiz">Начать самопроверку →</button></section>'+footer()+'</article></div>';const nav=main.querySelector('.toc');main.querySelectorAll('article h2').forEach((h,i)=>{h.id='section-'+i;const a=document.createElement('a');a.href='#'+m.id;a.textContent=(i+1)+'. '+h.textContent;a.onclick=e=>{e.preventDefault();h.scrollIntoView({behavior:'smooth'});};nav.appendChild(a);});document.getElementById('start-quiz').onclick=startQuiz;window.scrollTo(0,0);}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(){questions=shuffle(current.questions).map(q=>{const opts=shuffle(q.options.map((text,index)=>({text,index})));return {...q,options:opts.map(o=>o.text),correct_answer:opts.findIndex(o=>o.index===q.correct_answer)};});questionIndex=0;answers=[];showQuestion();}
function focusHeading(){const heading=main.querySelector('h1');heading.tabIndex=-1;heading.focus({preventScroll:true});}
function showQuestion(){closeFeedback();const q=questions[questionIndex];if(!q){showResult();return;}main.innerHTML='<div class="quiz"><p class="quiz-progress"><span>'+escapeHTML(current.metadata.title)+'</span><span>'+(questionIndex+1)+' / '+questions.length+'</span></p><h1>'+escapeHTML(q.text)+'</h1><div class="options">'+q.options.map((text,i)=>'<button data-answer="'+i+'">'+escapeHTML(text)+'</button>').join('')+'</div><button id="back-article">← К статье</button></div>';main.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer),b));document.getElementById('back-article').onclick=()=>article(current.metadata.id);window.scrollTo(0,0);focusHeading();}
function answer(index,button){const q=questions[questionIndex],correct=index===q.correct_answer;answers.push({id:q.id,correct,selected:q.options[index]});main.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(Number(b.dataset.answer)===q.correct_answer)b.classList.add('correct');else if(b===button)b.classList.add('incorrect');});previousFocus=button;paused=false;document.getElementById('feedback-title').textContent=correct?'Верно':'Попробуем разобраться';document.getElementById('feedback-explanation').textContent=q.explanation;document.getElementById('countdown').textContent=correct?'Следующий вопрос через 1 секунду':'Правильный ответ: '+q.options[q.correct_answer];document.getElementById('pause').hidden=!correct;feedback.hidden=false;document.getElementById('pause').focus();if(correct)timer=setTimeout(nextQuestion,1000);else document.getElementById('next').focus();}
function nextQuestion(){closeFeedback();questionIndex++;showQuestion();if(questionIndex===questions.length)focusHeading();}
function showResult(){const correct=answers.filter(a=>a.correct).length;main.innerHTML='<div class="quiz"><p class="eyebrow">Самопроверка завершена</p><h1>Что уже осталось в памяти?</h1><p class="score">'+correct+' / '+questions.length+'</p><p>Вернитесь к примерам из статьи и попробуйте ещё раз после перерыва.</p><button id="return-article">Читать материал</button> <button id="restart">Ещё один раунд</button>'+footer()+'</div>';document.getElementById('return-article').onclick=()=>article(current.metadata.id);document.getElementById('restart').onclick=startQuiz;}
document.getElementById('pause').onclick=()=>{stopTimer();paused=true;document.getElementById('countdown').textContent='Переход остановлен — можно спокойно прочитать объяснение';document.getElementById('pause').hidden=true;document.getElementById('next').focus();};document.getElementById('next').onclick=nextQuestion;
feedback.addEventListener('keydown',e=>{if(e.key==='Escape'){stopTimer();paused=true;document.getElementById('countdown').textContent='Переход остановлен';document.getElementById('pause').hidden=true;document.getElementById('next').focus();}else if(e.key==='Tab'){const visible=[...feedback.querySelectorAll('button')].filter(b=>!b.hidden);const first=visible[0],last=visible[visible.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
function route(){let id='';try{id=decodeURIComponent(location.hash.slice(1));}catch{location.hash='';}id?article(id):home();}
document.getElementById('home').onclick=()=>{location.hash='';home();};window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
