name: Image

# Builds the production image (Go services + Flutter web client) and publishes it
# to GHCR on pushes to master and manual runs. Pull requests only build.
# Deployment stays a Helm step in language_learner (quiz.kotopedia.org).
on:
  push:
    branches: [master]
    paths:
      - "cmd/**"
      - "internal/**"
      - "flutter/**"
      - "quizzes/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/t1oooo/quiz-master

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: stamp
        run: |
          echo "tag=$(date -u +%Y.%m.%d-%H%M)-${GITHUB_SHA::10}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            SERVER_BASE_URL=https://quiz.kotopedia.org
          tags: |
            ${{ env.IMAGE }}:${{ steps.stamp.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
