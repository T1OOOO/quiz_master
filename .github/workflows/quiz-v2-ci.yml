name: Quiz v2 CI

on:
  pull_request:
    paths: ["next/**", ".github/workflows/quiz-v2-ci.yml"]
  push:
    branches: [main]
    paths: ["next/**", ".github/workflows/quiz-v2-ci.yml"]

permissions:
  contents: read

concurrency:
  group: quiz-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: 1.25.0
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go vet ./next/server/...
      - name: Start isolated integration stack
        run: docker compose --project-name qm-ci-${{ github.run_id }} -f next/infra/compose.yml up --build --wait
      - name: PostgreSQL integration suite
        run: |
          port=$(docker compose --project-name qm-ci-${{ github.run_id }} -f next/infra/compose.yml port postgres 5432 | sed 's/.*://')
          QM_TEST_DATABASE_URL="postgres://quiz_master:quiz_master_development_only@127.0.0.1:${port}/quiz_master?sslmode=disable" go test -count=1 -tags integration ./next/server/internal/migrate ./next/server/internal/identity ./next/server/internal/store
      - name: Probe API health
        run: |
          port=$(docker compose --project-name qm-ci-${{ github.run_id }} -f next/infra/compose.yml port api 8080 | sed 's/.*://')
          curl --fail --retry 5 "http://127.0.0.1:${port}/health/live"
          curl --fail --retry 5 "http://127.0.0.1:${port}/health/ready"
      - name: Stack logs
        if: always()
        run: docker compose --project-name qm-ci-${{ github.run_id }} -f next/infra/compose.yml logs --no-color
      - name: Tear down isolated stack
        if: always()
        run: docker compose --project-name qm-ci-${{ github.run_id }} -f next/infra/compose.yml down --volumes --remove-orphans

  flutter:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: next/apps/quiz_app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
      - name: Reject private markers from Web output
        run: |
          markers=(private_grading accepted_variants correct_option_id correct_option_ids published_bundle '"draft"')
          for marker in "${markers[@]}"; do
            if grep -R -F -n -- "$marker" build/web; then
              echo "private marker found in Web artifact: $marker" >&2
              exit 1
            else
              status=$?
              if [ "$status" -eq 1 ]; then
                continue
              fi
              echo "private-marker scan failed with grep exit $status for $marker" >&2
              exit "$status"
            fi
          done
      - run: find build/web -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0r sha256sum > build/web/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quiz-v2-web-${{ github.sha }}
          path: next/apps/quiz_app/build/web
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: next/apps/quiz_app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17.0.17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - run: sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quiz-v2-debug-apk-${{ github.sha }}
          path: next/apps/quiz_app/build/app/outputs/flutter-apk
          if-no-files-found: error
