worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types application/javascript application/json application/wasm text/css image/svg+xml;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control no-cache always;
    location = /v1/reports {
      client_max_body_size 8m;
      proxy_pass http://127.0.0.1:8088;
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 20s;
    }
    location /v1/ {
      proxy_pass http://127.0.0.1:8088;
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 20s;
    }
    location = /health/ready { proxy_pass http://127.0.0.1:8088; }
    location = /health/live { proxy_pass http://127.0.0.1:8088; }
    location = /version.json { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
